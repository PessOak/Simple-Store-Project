<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleStore - Cadastro</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fontes e Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Bootstrap JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script defer src="CadastroProduto.js"></script>
</head>

<body>

    <!-- Cabeçalho da página -->
    <header class="fixed-top">
        <nav class="navbar navbar-expand-lg custom-navbar">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img class="logotipo" src="../imgs/simplestore-grande.png" width="150" alt="Logo">
                </a>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <form class="d-flex mx-auto" role="search" style="width: 60%;">
                        <input id="search-input" class="form-control campo-buscar border-0" type="search"
                            placeholder="Buscar Produto" aria-label="Search">
                        <button class="btn btn-outline btn-secundario" type="button">
                            <i class="ri-search-line ri-xl"></i>
                        </button>
                    </form>
                </div>
            </div>
        </nav>
    </header>

    <!-- Conteúdo principal -->
    <div class="container mt-5 pt-5">
        <div class="row">
            <!-- Formulário cadastro -->
            <div class="col-md-6">
                <form id="product-form">
                    <h2 class="mb-4">Adicionar Produto</h2>
                    <div class="row mb-3">
                        <div class="col">
                            <label for="product-name" class="form-label">Nome do Produto</label>
                            <input type="text" class="form-control" id="product-name" placeholder="Nome do produto">
                        </div>
                        <div class="col">
                            <label for="product-price" class="form-label">Preço de Venda</label>
                            <input type="number" class="form-control" id="product-price" placeholder="Preço de venda">
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label for="product-category" class="form-label">Categoria</label>
                            <input type="text" class="form-control" id="product-category" placeholder="Categoria">
                        </div>
                        <div class="col">
                            <label for="product-stock" class="form-label">Estoque Disponível</label>
                            <input type="number" class="form-control" id="product-stock" placeholder="Estoque disponível">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="product-description" class="form-label">Descrição</label>
                        <textarea class="form-control" id="product-description" rows="2"
                            placeholder="Descrição do produto"></textarea>
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label for="product-min-stock" class="form-label">Estoque Mínimo</label>
                            <input type="number" class="form-control" id="product-min-stock" placeholder="Estoque mínimo">
                        </div>
                        <div class="col">
                            <label for="product-max-stock" class="form-label">Estoque Máximo</label>
                            <input type="number" class="form-control" id="product-max-stock" placeholder="Estoque máximo">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="product-image" class="form-label">Imagem do Produto</label>
                        <input type="file" class="form-control" id="product-image" accept="image/*">
                    </div>
                    <button type="submit" class="btn btn-primary">Adicionar Produto</button>
                </form>
            </div>

            <!-- Container p/ cards dos produtos -->
            <div class="col-md-6">
                <div id="product-container" class="d-flex flex-column gap-3"></div>
            </div>
        </div>
    </div>

     <!-- Rodapé da pg -->
     <footer>
        <div class="p-4 mt-2 mb-2">
            <div class="text-center">
                <p class="mb-1"><strong>&copy; 2024 SimpleStore.</strong> Todos os direitos reservados.
                </p>
            </div>

            <div class="text-center">
                <p class="m-0">Precisa de ajuda?
                    <a class="email" href="mailto:simplestore@gmail.com">
                        Fale com a gente.
                    </a>
                </p>
            </div>
        </div>
    </footer>
</body>

</html>
