<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleStore - Login</title>

    <!-- CUIDADO...PRESTE ATENÇÃO QUANDO FOR COPIAR DAQUI, CONFIRME SE OS CAMINHOS ESTARÃO CERTOS NA SUA PÁGINA, SE OS CAMINHOS ESTIVEREM ERRADOS COSTUMA NÃO FUNCIONAR BEM O CSS-->

    <!-- Importação do ícone que fica lá encima na guia do navegador -->
    <link rel="shortcut icon" href="../imgs/favicon.svg" type="image/x-icon">
    <!-- Importação do css do bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- Importação da familia de fontes montserrat -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <!-- Importação ícones remix-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="login_fornecedor.css">
    <!-- Importação do js do bootstrap -->
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
    <!-- Java Script - OBS: Esse "defer" faz com que você não precise colocar ele ao final do arquivo-->
    <script defer src="cadastro_cliente.js"></script>
</head>

<body>

    <!-- Cabeçalho da página -->
    <header>
        <nav class="navbar navbar-expand-lg custom-navbar">
            <div class="container-fluid">
                <a class="navbar-brand" href="../index.html">
                    <img class="logotipo" src="../imgs/simplestore-svg.svg" height="70" alt="Logo"
                        class="d-inline-block align-text-top">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                    <div class="d-flex ">
                        <ul class="navbar-nav ms-auto align-items-center">
                            <li class="btn-group nav-item me-3 ri-lx align-items-center ">
                                <a class="link text-white nav-link ps-0 cor-verde-hover" data-bs-toggle="dropdown"
                                    data-bs-auto-close="true" aria-expanded="false"> Entrar
                                </a>
                                <ul class="dropdown-menu rounded-1 bg-dropdown">
                                    <li><a class="nav-link link-comprador p-3" href="#"> Comprador</a></li>
                                    <li><a class="nav-link link-vendedor p-3" href="#">Vendedor</a>
                                </ul>
                            </li>
                            <li class="nav-item me-3">
                                <a class="nav-link cor-verde-hover" href="#">
                                    <i class="ri-shopping-cart-line ri-lg cor-verde-hover"></i>
                                </a>
                            </li>
                            <li class="nav-item me-3 link">
                                <a class="nav-link text-white me-4 cor-verde-hover" href="#">Pedidos</a>
                            </li>

                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </header>


    <!-- Conteúdo principal da página -->
    <main>
        <div class="fundo">
            <form class="form-fundo" action="/submit" method="post">

                <h2>Acesse a sua conta como Fornecedor</h2>

                <div class="form-floating mt-4 mb-3">
                    <input type="email" class="form-control" id="" placeholder="examplo@gmail.com">
                    <label for="">E-mail</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="" placeholder="@123exemplo">
                    <label for="">Senha</label>
                </div>

                <div class="text-center mt-5">
                    <button type="button" class="btn btn-primary btn-padrao btn-lg">Entrar</button>
                </div>

                <div class="text-center mt-5">
                    <p>
                        <i class=" ri-question-line" width="200px"></i> Não tem uma conta?
                        <a class="email" href="mailto:jessica.calm.dev@hotmail.com">
                            CADASTRAR.
                        </a>
                    </p>

                </div>

            </form>
    </main>

    <!-- Rodapé da página -->
    <footer>
        <div class="text-center">
            <p><strong>&copy; 2024 SimpleStore.</strong> Todos os direitos reservados.
            </p>
        </div>

        <div class="text-center mb-5">
            <p>Precisa de ajuda?
                <a class="email" href="mailto:simplestore@gmail.com">
                    Fale com a gente.
                </a>
            </p>
        </div>
    </footer>

</body>

</html>
