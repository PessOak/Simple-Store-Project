<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleStore - Cadastro</title>

    <!-- CUIDADO...PRESTE ATENÇÃO QUANDO FOR COPIAR DAQUI, CONFIRME SE OS CAMINHOS ESTARÃO CERTOS NA SUA PÁGINA, SE OS CAMINHOS ESTIVEREM ERRADOS COSTUMA NÃO FUNCIONAR BEM O CSS-->

    <!-- Importação do ícone que fica lá encima na guia do navegador -->
    <link rel="shortcut icon" href="../imgs/favicon.svg" type="image/x-icon">
    <!-- Importação do css do bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Importação da familia de fontes montserrat -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <!-- Importação ícones remix-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="cadastro_cliente.css">
    <!-- Importação do js do bootstrap -->
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <!-- Java Script - OBS: Esse "defer" faz com que você não precise colocar ele ao final do arquivo-->
    <script defer src="cadastro_cliente.js"></script>
</head>

<body>

    <!-- Cabeçalho da página -->
    <header class="fixed-top">
        <nav class="navbar navbar-expand-lg custom-navbar">
            <div class="container-fluid">
                <a class="navbar-brand" href="../index.html">
                    <img class="logotipo" src="../imgs/simplestore-grande.png" width="150" alt="Logo"
                        class="d-inline-block align-text-top">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse alinhamento-conteudo" id="navbarNav">
                    <form class="d-flex mx-auto" role="search" style="width: 60%;">
                        <input class="form-control campo-buscar border-0" type="search" placeholder="Buscar Produto"
                            aria-label="Search" style="flex-grow: 1;">
                        <button class="btn btn-outline btn-secundario" type="submit">
                            <i class="ri-search-line ri-xl"></i>
                        </button>
                    </form>

                    <ul class="navbar-nav ms-auto align-items-center">
                        <li class="btn-group nav-item me-3 ri-lx align-items-center">
                            <a class="link-entrar nav-link ps-0 cor-branca-hover" data-bs-toggle="dropdown"
                                data-bs-auto-close="true" aria-expanded="false">Entrar</a>
                            <ul class="dropdown-menu rounded-1 bg-dropdown">
                                <li><a class="nav-link link-comprador p-3" href="#">Comprador</a>
                                </li>

                                <li><a class="nav-link link-vendedor p-3" href="#">Vendedor</a>
                            </ul>
                        </li>

                        <li class="nav-item me-3">
                            <a class="nav-link cor-verde-hover" href="#">
                                <i class="ri-shopping-cart-line ri-lg cor-verde-hover"></i>
                            </a>
                        </li>

                        <li class="nav-item me-3 link">
                            <a class="nav-link text-white me-4 cor-verde-hover" href="#">Pedidos</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>


    <!-- Conteúdo principal da página -->
    <main>
        <div class="fundo-branco">
            <form action="/submit" method="post">

                <h2>Crie uma conta</h2>

                <div class="form-floating mt-4 mb-3">
                    <input type="email" class="form-control" id="email" placeholder="examplo@gmail.com">
                    <label for="email">E-mail</label>
                </div>

                <div class="row">
                    <div class="form-floating mb-3 col-6">
                        <input type="password" class="form-control" id="senha" placeholder="@123exemplo">
                        <label for="senha">Senha</label>

                    </div>
                    <div class="form-floating mb-4 col-6">
                        <input type="password" class="form-control" id="" placeholder="@123exemplo">
                        <label for="confirmarSenha">Confirmar Senha</label>
                    </div>
                </div>

                <h5>Dados pessoais</h5>

                <div class="form-floating mt-3 mb-3">
                    <input type="text" class="form-control" id="" placeholder="João Sebastião da Silva">
                    <label for="">Nome</label>
                </div>

                <div class="form-floating mt-3 mb-3">
                    <input type="tel" class="form-control" id="" placeholder="31999999999">
                    <label for="">Celular</label>
                </div>

                <div class="form-floating mt-3 mb-3">
                    <input type="date" class="form-control" id="" placeholder="01/01/2001">
                    <label for="">Data de Nacimento</label>
                </div>

                <div class="form-floating mt-3 mb-4">
                    <input type="text" class="form-control" id="" placeholder="11111111111">
                    <label for="">CPF</label>
                </div>

                <h5>Endereço</h5>

                <div class="form-floating mt-3 mb-3">
                    <input type="number" class="form-control" id="" placeholder="11111111">
                    <label for="">CEP</label>
                </div>

                <div class="row">
                    <div class="form-floating col-9">
                        <input type="text" class="form-control" id="logradouro" placeholder="Rua Nossa do Carmo">
                        <label for="logradouro">Logradouro</label>
                    </div>

                    <div class="form-floating col-3">
                        <input type="text" class="form-control" id="" placeholder="Rua Nossa do Carmo">
                        <label for="">Número</label>
                    </div>
                </div>

                <div class="form-floating mt-3 mb-3">
                    <input type="text" class="form-control" id="" placeholder="Bom Sucesso">
                    <label for="">Bairro</label>
                </div>

                <div class="row justify-content-between">
                    <div class="col-9 form-floating">
                        <select class=" form-select" aria-label="Large select example">
                            <option selected>Belo Horizonte</option>
                            <option value="1">Florianópolis</option>
                            <option value="2">São Paulo</option>
                            <option value="3">Rio de Janeiro</option>
                        </select>
                        <label for="floatingSelect">Cidade</label>
                    </div>

                    <div class="col-3 form-floating">
                        <select class=" form-select" aria-label="Large select example">
                            <option selected>MG</option>
                            <option value="1">SC</option>
                            <option value="2">SP</option>
                            <option value="3">RJ</option>
                        </select>
                        <label for="floatingSelect">Estado</label>
                    </div>
                </div>

                <div class="text-center mt-5">
                    <button type="button" class="btn btn-primary btn-padrao btn-lg">Criar Conta</button>
                </div>

                <div class="text-center mt-4">
                    <p class="mb-0">
                        <i class=" ri-question-line" width="200px"></i> Já possui uma conta?
                        <a class="email" href="../login_cliente/login_cliente.html">
                            ENTRAR.
                        </a>
                    </p>
                </div>
            </form>
    </main>

    <!-- Rodapé da página -->
    <footer>
        <div class="p-4 mt-2 mb-2">
            <div class="text-center">
                <p class="mb-1"><strong>&copy; 2024 SimpleStore.</strong> Todos os direitos reservados.
                </p>
            </div>

            <div class="text-center">
                <p class="m-0">Precisa de ajuda?
                    <a class="email" href="mailto:simplestore@gmail.com">
                        Fale com a gente.
                    </a>
                </p>
            </div>
        </div>
    </footer>
</body>

</html>
