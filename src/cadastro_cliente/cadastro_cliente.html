<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleStore - Cadastro</title>
    <link rel="shortcut icon" href="../imgs/favicon.svg" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="cadastro_cliente.css">
    <link defer rel="stylesheet" href="cadastro_cliente.css">
    <script defer src="cadastro_cliente.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
</head>

<body>

    <!-- Cabeçalho da página -->
    <header>
        <nav class="navbar navbar-expand-lg custom-navbar">
            <div class="container-fluid">
                <a class="navbar-brand" href="../index.html">
                    <img class="logotipo" src="../imgs/simplestore-svg.svg" height="70" alt="Logo"
                        class="d-inline-block align-text-top">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">

                    <form class="d-flex mx-auto" role="search" style="width: 50%;">
                        <input class="form-control me-2" type="search" placeholder="Buscar Produto" aria-label="Search"
                            style="flex-grow: 1;">
                        <button class="btn btn-outline-success" type="submit">
                            <i class="bi bi-search"></i>
                        </button>
                    </form>

                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item me-3">
                            <a class="nav-link text-white" href="#">Pedidos</a>
                        </li>
                        <li class="nav-item me-3">
                            <a class="nav-link text-white" href="#">
                                <i class="fas fa-shopping-cart" style="font-size: 30px;"></i>
                            </a>
                        </li>
                        <li class="nav-item me-3">
                            <button class="btn btn-custom px-4 py-2" type="button">Entrar</button>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>


    <!-- Conteúdo principal da página -->
    <main>
        <div class="fundo">
            <form class="form-fundo" action="/submit" method="post">

                <h2>Crie uma conta</h2>

                <div class="form-floating mt-4 mb-3">
                    <input type="email" class="form-control" id="" placeholder="">
                    <label for="">E-mail</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
                    <label for="floatingPassword">Senha</label>
                </div>
                <div class="form-floating mb-5">
                    <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
                    <label for="floatingPassword">Confirmar Senha</label>
                </div>

                <h5 class="">Dados pessoais</h5>

                <div class="form-floating mt-3 mb-3">
                    <input type="" class="form-control" id="" placeholder="name@example.com">
                    <label for="">Nome</label>
                </div>

                <div class="form-floating mt-3 mb-3">
                    <input type="" class="form-control" id="" placeholder="name@example.com">
                    <label for="">Celular</label>
                </div>

                <div class="form-floating mt-3 mb-3">
                    <input type="date" class="form-control" id="" placeholder="name@example.com">
                    <label for="">Data de Nacimento</label>
                </div>

                <div class="form-floating mt-3 mb-3">
                    <input type="text" class="form-control" id="" placeholder="name@example.com">
                    <label for="">CPF</label>
                </div>

                <h5>Endereço</h5>

                <div class="form-floating mt-3 mb-3">
                    <input type="text" class="text-success-emphasis
                    form-control" id="" placeholder="name@example.com">
                    <label for="">Logradouro</label>
                </div>

                <div class="form-floating mt-3 mb-3">
                    <input type="text" class="text-success-emphasis
                    form-control" id="" placeholder="name@example.com">
                    <label for="">Bairro</label>
                </div>

                <div class="row">
                    <select class="col form-select mb-3" aria-label="Large select example">
                        <option selected>Cidade</option>
                        <option value="1">Belo Horizonte</option>
                        <option value="2">Two</option>
                        <option value="3">Three</option>
                    </select>

                    <select class="col-sm-2 form-select mb-3" aria-label="Large select example">
                        <option selected>Cidade</option>
                        <option value="1">Belo Horizonte</option>
                        <option value="2">Two</option>
                        <option value="3">Three</option>
                    </select>
                </div>

            </form>
    </main>

    <!-- Rodapé da página -->
    <footer>
        <p>&copy; 2024 SimpleStore. Todos os direitos reservados.
        </p>
        <p><a href="mailto:simplestore@gmail.com">E-mal para contato</a></p>
    </footer>


</body>

</html>
